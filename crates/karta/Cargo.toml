[package]
name = "karta"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Karta social-media link parser bot and CLI"

[dependencies]
kovi.workspace = true
kovi-onebot.workspace = true
karta-kovi.workspace = true
karta-core.workspace = true
karta-platforms.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json.workspace = true
tracing.workspace = true
anyhow = "1"
mimalloc = "0.1"
tracing-subscriber.workspace = true

[features]
ytdlp = ["karta-kovi/ytdlp", "karta-core/ytdlp", "karta-platforms/ytdlp"]

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
test-harness = { workspace = true, features = ["kovi"] }

[lints]
workspace = true
