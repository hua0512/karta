[package]
name = "karta-kovi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kovi framework adapter for karta-core"

[features]
default = []
ytdlp = ["karta-platforms/ytdlp"]

[dependencies]
karta-core.workspace = true
karta-platforms.workspace = true
kovi.workspace = true
kovi-onebot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
base64.workspace = true
qrcode.workspace = true
image = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "fs", "rt", "macros"] }
wreq = { workspace = true, features = ["json", "cookies"] }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
test-harness = { workspace = true, features = ["kovi"] }
# Paused clock for the single-flight scenario.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
